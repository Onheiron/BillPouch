name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC

jobs:
  deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
