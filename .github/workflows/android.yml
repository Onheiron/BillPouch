name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "crates/bp-core/**"
      - "crates/bp-api/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Build the Android app (Bill)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the Android platform and NDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - name: Generate the icons
        run: npx tauri icon ../crates/bp-api/static/icon.svg

      - name: Generate the Android project
        run: npx tauri android init --ci
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}

      - name: Build the APK
        run: npx tauri android build --debug --apk --target aarch64 --ci
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}

      - uses: actions/upload-artifact@v4
        with:
          name: billpouch-android
          path: android/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
