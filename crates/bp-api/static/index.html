<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e88e5">
<title>BillPouch</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="/icon.svg" alt="" width="34" height="34">
    <span>BillPouch</span>
  </div>
  <label class="network-pick">
    <span>Network</span>
    <select id="network"></select>
  </label>
  <div class="service-menu">
    <button class="button accent small" id="service-button" aria-haspopup="true" aria-expanded="false">＋ Service</button>
    <div class="menu" id="service-menu" hidden></div>
  </div>
  <div class="me" id="me"></div>
  <span class="live" id="live" title="Daemon connection"></span>
</header>

<div class="banner" id="banner" hidden></div>

<main>
  <section class="cards" id="summary"></section>

  <section class="panel">
    <div class="panel-head">
      <h2>Nodes</h2>
      <div class="tabs" id="node-tabs">
        <button data-kind="all" class="active">All</button>
        <button data-kind="pouch">Pouches</button>
        <button data-kind="bill">Bills</button>
        <button data-kind="post">Roosts</button>
      </div>
    </div>
    <div class="nodes" id="nodes"></div>
  </section>

  <section class="panel files-panel" id="files-panel">
    <div class="panel-head">
      <h2>Files</h2>
      <label class="button accent">
        <input type="file" id="picker" multiple hidden>
        Upload files
      </label>
    </div>
    <div class="dropzone" id="dropzone">
      <strong>Drop files here</strong>
      <span>They are encrypted on this device, split and spread across the Pouches of the network.</span>
    </div>
    <div class="uploads" id="uploads"></div>
    <div class="files" id="files"></div>
  </section>
</main>

<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
