[package]
name = "billpouch-android"
version = "0.3.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["BillPouch Contributors"]
publish = false

[lib]
name = "billpouch_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bp-core = { path = "../crates/bp-core" }
bp-api  = { path = "../crates/bp-api", default-features = false }

tauri               = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs     = "2"
axum                = "0.8"
tower               = { version = "0.5", features = ["util"] }
tokio               = { version = "1", features = ["full"] }
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"

[workspace]
