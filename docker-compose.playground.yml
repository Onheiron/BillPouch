services:

  carlo:
    image: billpouch:local
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - shared:/shared
    container_name: bp-carlo
    hostname: bp-carlo
    environment:
      NODE_NAME: "carlo"
      FOUNDER: "true"
      SERVICES: "pouch,bill"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4001"
      STORAGE_TIER: "T1"
      STORAGE_SIZE: "512MiB"
      RUST_LOG: "bp_core=info,bp_cli=info"
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - bp-playground

  marco:
    image: billpouch:local
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - shared:/shared
    container_name: bp-marco
    hostname: bp-marco
    environment:
      NODE_NAME: "marco"
      SERVICES: "post,pouch"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4002"
      STORAGE_TIER: "T1"
      STORAGE_SIZE: "512MiB"
      RUST_LOG: "bp_core=info,bp_cli=info"
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - bp-playground

  lucia:
    image: billpouch:local
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - shared:/shared
    container_name: bp-lucia
    hostname: bp-lucia
    environment:
      NODE_NAME: "lucia"
      SERVICES: "bill,post"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4003"
      RUST_LOG: "bp_core=info,bp_cli=info"
    ports:
      - "127.0.0.1:3003:3000"
    networks:
      - bp-playground

  elena:
    image: billpouch:local
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - shared:/shared
    container_name: bp-elena
    hostname: bp-elena
    environment:
      NODE_NAME: "elena"
      SERVICES: "pouch"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4004"
      STORAGE_TIER: "T1"
      STORAGE_SIZE: "512MiB"
      RUST_LOG: "bp_core=info,bp_cli=info"
    ports:
      - "127.0.0.1:3004:3000"
    networks:
      - bp-playground

  paolo:
    image: billpouch:local
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - shared:/shared
    container_name: bp-paolo
    hostname: bp-paolo
    environment:
      NODE_NAME: "paolo"
      SERVICES: "bill"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4005"
      RUST_LOG: "bp_core=info,bp_cli=info"
    ports:
      - "127.0.0.1:3005:3000"
    networks:
      - bp-playground

  me:
    image: billpouch:local
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - shared:/shared
    container_name: bp-me
    hostname: bp-me
    stdin_open: true
    tty: true
    environment:
      NODE_NAME: "me"
      INTERACTIVE: "true"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4006"
      RUST_LOG: "bp_core=info,bp_cli=info"
    ports:
      - "127.0.0.1:3006:3000"
    networks:
      - bp-playground

networks:
  bp-playground:
    driver: bridge

volumes:
  shared:
