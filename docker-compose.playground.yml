services:

  carlo:
    image: onheirongithub/billpouch:latest
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./playground/data/carlo:/root/.local/share/billpouch
    container_name: bp-carlo
    hostname: bp-carlo
    environment:
      NODE_NAME: "carlo"
      SERVICES: "pouch,bill"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4001"
      STORAGE_TIER: "T1"
      RUST_LOG: "bp_core=info,bp_cli=info"
    networks:
      - bp-playground

  marco:
    image: onheirongithub/billpouch:latest
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./playground/data/marco:/root/.local/share/billpouch
    container_name: bp-marco
    hostname: bp-marco
    environment:
      NODE_NAME: "marco"
      SERVICES: "post,pouch"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4002"
      STORAGE_TIER: "T1"
      RUST_LOG: "bp_core=info,bp_cli=info"
    networks:
      - bp-playground

  lucia:
    image: onheirongithub/billpouch:latest
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./playground/data/lucia:/root/.local/share/billpouch
    container_name: bp-lucia
    hostname: bp-lucia
    environment:
      NODE_NAME: "lucia"
      SERVICES: "bill,post"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4003"
      RUST_LOG: "bp_core=info,bp_cli=info"
    networks:
      - bp-playground

  elena:
    image: onheirongithub/billpouch:latest
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./playground/data/elena:/root/.local/share/billpouch
    container_name: bp-elena
    hostname: bp-elena
    environment:
      NODE_NAME: "elena"
      SERVICES: "pouch"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4004"
      STORAGE_TIER: "T1"
      RUST_LOG: "bp_core=info,bp_cli=info"
    networks:
      - bp-playground

  paolo:
    image: onheirongithub/billpouch:latest
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./playground/data/paolo:/root/.local/share/billpouch
    container_name: bp-paolo
    hostname: bp-paolo
    environment:
      NODE_NAME: "paolo"
      SERVICES: "bill"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4005"
      RUST_LOG: "bp_core=info,bp_cli=info"
    networks:
      - bp-playground

  me:
    image: onheirongithub/billpouch:latest
    volumes:
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./playground/data/me:/root/.local/share/billpouch
    container_name: bp-me
    hostname: bp-me
    stdin_open: true
    tty: true
    environment:
      NODE_NAME: "me"
      INTERACTIVE: "true"
      NETWORK: "playground"
      BP_LISTEN_PORT: "4006"
      RUST_LOG: "bp_core=info,bp_cli=info"
    networks:
      - bp-playground

networks:
  bp-playground:
    driver: bridge
