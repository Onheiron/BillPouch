services:
  node-pouch:
    build: .
    container_name: bp-pouch
    hostname: bp-pouch
    environment:
      NODE_NAME: "carlo-pouch"
      NETWORK: "smoketest"
      RUST_LOG: "bp_core=debug,bp_cli=info"
    networks:
      - bp-lan

  node-bill:
    build: .
    container_name: bp-bill
    hostname: bp-bill
    environment:
      NODE_NAME: "marco-bill"
      NETWORK: "smoketest"
      RUST_LOG: "bp_core=debug,bp_cli=info"
    networks:
      - bp-lan

  node-post:
    build: .
    container_name: bp-post
    hostname: bp-post
    environment:
      NODE_NAME: "lucia-post"
      NETWORK: "smoketest"
      RUST_LOG: "bp_core=debug,bp_cli=info"
    networks:
      - bp-lan

networks:
  bp-lan:
    driver: bridge
